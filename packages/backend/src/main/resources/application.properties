# HTTP server — port 3001 matches the frontend dev proxy default.
server.port=${PORT:3001}
spring.application.name=dragons-backend

# Upstream game API + client tuning.
game.api.base-url=${GAME_API_BASE_URL:https://dragonsofmugloar.com/api/v2}
game.api.timeout-ms=${GAME_API_TIMEOUT_MS:15000}
game.api.max-retries=${GAME_API_MAX_RETRIES:3}

# CORS origin allowed for the SPA (dev proxy makes this same-origin anyway).
game.cors.allowed-origin=${CORS_ORIGIN:*}
